name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Configured through release-please-config.json and
      # .release-please-manifest.json (the action's default paths), so that
      # CITATION.cff gets its version bumped alongside package.json.
      - uses: googleapis/release-please-action@v4
